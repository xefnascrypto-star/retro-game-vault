name: Review market prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-market.mjs
      - .github/workflows/market-prices.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live prices and record review
        run: node scripts/update-market.mjs
      - run: npm run check
      - run: npm run build
      - name: Preserve review in Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-reviews.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record market price review'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact availability
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
